<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Molly's Paris Adventure Countdown</title>
    <meta name="description" content="Countdown to Molly's exciting trip to Paris!">
    <meta name="theme-color" content="#8B7355">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-y: auto;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #d4a373 0%, #8B7355 50%, #5a4a3a 100%);
            position: relative;
            display: block;
        }

        /* Sepia-toned Paris background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1600&h=900&fit=crop') center/cover no-repeat;
            filter: sepia(0.5) brightness(0.85) contrast(1.1);
            z-index: 1;
        }

        /* Overlay for readability */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            padding-top: 80px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: #f5f1e8;
            margin-bottom: 30px;
            margin-top: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin: 40px 0;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 20px 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .countdown-number {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            color: #ffd700;
            font-family: 'Playfair Display', serif;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.85rem;
            color: #f5f1e8;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .french-message {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: #ffd700;
            margin: 40px 0 20px;
            font-style: italic;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .french-translation {
            font-size: 0.95rem;
            color: #e8e4d8;
            margin-bottom: 40px;
        }

        .resources {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 700px;
            margin: 40px auto;
        }

        .resource-link {
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.6);
            color: #ffd700;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .resource-link:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 215, 0, 0.8);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #c9bfb3;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .countdown {
                gap: 12px;
                margin: 30px 0;
            }

            .countdown-item {
                padding: 15px 10px;
            }

            h1 {
                margin-bottom: 20px;
                margin-top: 50px;
            }

            .container {
                padding-top: 120px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Molly's Paris Adventure</h1>
        <p id="countdownLabel" style="font-size:1.1rem; color:#f5f1e8; margin-top:10px; margin-bottom:10px;">Depart from Paul VI High School</p>

        <div class="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">0</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">0</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">0</div>
                <div class="countdown-label">Minutes</div>
            </div>
        </div>

        <div class="french-message">Bon Voyage, Molly!</div>
        <div class="french-translation">"Have a wonderful adventure, Molly!"</div>

        <div class="resources">
            <a href="important.html" class="resource-link">⚠️ Important</a>
            <a href="french.html" class="resource-link">French Phrasebook</a>
            <a href="https://www.timeout.com/paris" target="_blank" class="resource-link">Things to Do</a>
            <a href="https://www.history.com/topics/european-history/paris" target="_blank" class="resource-link">Paris History</a>
            <a href="https://www.theartnewspaper.com/" target="_blank" class="resource-link">Culture & News</a>
            <a href="https://www.parisinsiderguide.com/" target="_blank" class="resource-link">Local Guides</a>
            <a href="https://www.paris.fr/" target="_blank" class="resource-link">Paris Official</a>
        </div>

        <div class="footer">
            © 2026 Drive Applied, LLC
        </div>
    </div>

    <script>
        function updateCountdown() {
            // Set target time: 4:30 PM EST on April 2, 2026
            // EST is UTC-5, so convert to local timezone
            const targetDate = new Date('2026-04-02T16:30:00-05:00').getTime();
            
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
        }

        // Update countdown immediately and then every minute
        updateCountdown();
        setInterval(updateCountdown, 60000);
    </script>
</body>

</html>
